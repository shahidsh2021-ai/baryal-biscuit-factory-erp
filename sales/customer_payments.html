<head>
  <meta charset="utf-8" />

  <style>
    :root{
      --erp-primary:#0b2a4a;
      --erp-success:#198754;
      --erp-warning:#fd7e14;
      --erp-danger:#dc3545;
      --erp-info:#0d6efd;
      --erp-dark-sidebar:#0b2a4a;
    }

    body{
      background:
        radial-gradient(1200px 800px at 15% 0%, rgba(11,42,74,.12), transparent 60%),
        radial-gradient(1000px 700px at 100% 0%, rgba(25,135,84,.10), transparent 55%),
        #f8fafc;
    }

    .main-sidebar{ background:var(--erp-dark-sidebar) !important; }
    .main-sidebar .brand-link{ background:linear-gradient(135deg, rgba(11,42,74,.95), rgba(11,42,74,.75)); }
    .main-sidebar .nav-treeview{ background:rgba(255,255,255,.03); }

    .erp-card{
      border-radius:1rem;
      border:1px solid rgba(11,42,74,.10);
      box-shadow:0 10px 24px rgba(11,42,74,.06);
      overflow:hidden;
      background:rgba(255,255,255,.92);
    }

    .page-title{ color:var(--erp-primary); font-weight:950; letter-spacing:-0.01em; }
    .section-ribbon{ height:6px;border-radius:999px;background:linear-gradient(90deg, rgba(11,42,74,1), rgba(25,135,84,.9)); width:120px; }
    .panel-title{ display:flex; align-items:center; gap:.55rem; font-weight:900; line-height:1.2; }

    .kpi-card{
      border-radius:.95rem;
      border:1px solid rgba(11,42,74,.12);
      box-shadow:0 10px 24px rgba(11,42,74,.06);
      overflow:hidden;
      background:rgba(255,255,255,.95);
    }
    .kpi-top{ height:10px; background:linear-gradient(90deg, rgba(11,42,74,1), rgba(25,135,84,.85)); }
    .kpi-value{ font-size:2.05rem; font-weight:900; letter-spacing:-0.02em; color:var(--erp-primary); }
    .kpi-label{ color:rgba(0,0,0,.62); font-weight:650; }

    .payment-badge{ border:1px solid transparent; font-weight:750; white-space:nowrap; }
    .pay-paid{ background:rgba(25,135,84,.12); color:var(--erp-success); border-color:rgba(25,135,84,.25); }
    .pay-partial{ background:rgba(13,110,253,.12); color:var(--erp-info); border-color:rgba(13,110,253,.25); }
    .pay-unpaid{ background:rgba(108,117,125,.12); color:#495057; border-color:rgba(108,117,125,.25); }

    .status-badge{ border:1px solid transparent; font-weight:750; white-space:nowrap; }
    .badge-completed{ background:rgba(25,135,84,.12); color:var(--erp-success); border-color:rgba(25,135,84,.25); }
    .badge-pending{ background:rgba(13,110,253,.12); color:var(--erp-info); border-color:rgba(13,110,253,.25); }
    .badge-cancelled{ background:rgba(220,53,69,.12); color:var(--erp-danger); border-color:rgba(220,53,69,.25); }

    .table thead th{
      font-weight:850;
      color:rgba(0,0,0,.75);
      background:rgba(11,42,74,.04);
      border-bottom-width:1px;
    }
    .table tbody td{ vertical-align:middle; }
    .table.dataTable{ width:100% !important; }

    .dataTables_wrapper .dataTables_length,
    .dataTables_wrapper .dataTables_filter{ padding-top:.1rem; }
    .dataTables_wrapper .dataTables_filter{ float:none !important; text-align:right; }

    @media (max-width:575.98px){
      .dataTables_wrapper .dataTables_filter{ text-align:left; }
      .dataTables_wrapper .dt-buttons{ display:flex; flex-wrap:wrap; gap:.35rem; }
    }

    .action-btn{ cursor:pointer; border-radius:.7rem; padding:.35rem .5rem; }
    .btn-erp{ background:var(--erp-primary); color:#fff; border-color:var(--erp-primary); }
    .btn-erp:hover{ background:#0e3a64; border-color:#0e3a64; color:#fff; }

    .modal-header.bg-erp{
      background:linear-gradient(90deg, rgba(11,42,74,.95), rgba(25,135,84,.85));
      color:#fff;
    }

    .chart-card{
      border-radius:1rem;
      border:1px solid rgba(11,42,74,.10);
      background:rgba(255,255,255,.92);
      box-shadow:0 10px 24px rgba(11,42,74,.05);
      overflow:hidden;
    }

    [data-bs-theme="dark"] .erp-card,
    [data-bs-theme="dark"] .kpi-card,
    [data-bs-theme="dark"] .chart-card{
      background:rgba(255,255,255,.03);
      border-color:rgba(255,255,255,.10) !important;
      box-shadow:none;
    }
    [data-bs-theme="dark"] .kpi-label{ color:rgba(255,255,255,.65); }
    [data-bs-theme="dark"] .table thead th{ color:rgba(255,255,255,.88); background:rgba(255,255,255,.06); }
    [data-bs-theme="dark"] .status-badge,
    [data-bs-theme="dark"] .payment-badge{ color:rgba(255,255,255,.92); }

    .chart-title{
      font-weight:900;
      color:var(--erp-primary);
      display:flex;
      align-items:center;
      gap:.55rem;
    }

    .detail-label{
      color:rgba(0,0,0,.62);
      font-weight:700;
    }

    [data-bs-theme="dark"] .detail-label{ color:rgba(255,255,255,.65); }
  </style>
</head>
