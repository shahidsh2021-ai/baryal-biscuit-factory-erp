<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baryal Biscuit Factory ERP • Sign in</title>

  <!-- AdminLTE 4 (Bootstrap 5) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/css/adminlte.min.css" />

  <!-- Bootstrap 5 (AdminLTE depends on it, but include explicitly for completeness) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css" />

  <!-- OverlayScrollbars (AdminLTE UI enhancement) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars/css/OverlayScrollbars.min.css" />

  <style>
    :root{
      --erp-primary:#0b2a4a;
      --erp-primary-2:#0e3a64;
      --erp-surface:#ffffff;
      --erp-muted:#6b7280;
    }

    body{
      background:
        radial-gradient(1200px 800px at 15% 0%, rgba(11,42,74,.18), transparent 60%),
        radial-gradient(1000px 700px at 100% 0%, rgba(25,135,84,.16), transparent 55%),
        #f8fafc;
    }

    html[data-bs-theme="dark"]{
      --erp-surface:#0f172a;
      --erp-muted:#cbd5e1;
    }

    .erp-brand-mark{
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: rgba(11,42,74,.10);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .erp-card{
      border-radius: 1.1rem;
      border: 1px solid rgba(11,42,74,.16);
      box-shadow: 0 18px 40px rgba(11,42,74,.08);
      overflow: hidden;
    }

    .erp-card-header{
      background: linear-gradient(90deg, rgba(11,42,74,.95), rgba(11,42,74,.75));
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,.10);
    }

    .erp-card-header .subline{ color: rgba(255,255,255,.85); }

    .form-floating > label{ padding-top: .75rem; }

    .btn-erp{
      background: var(--erp-primary);
      border-color: var(--erp-primary);
    }

    .btn-erp:hover{
      background: var(--erp-primary-2);
      border-color: var(--erp-primary-2);
    }

    .glass{
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(8px);
    }

    html[data-bs-theme="dark"] .glass{
      background: rgba(15,23,42,.55);
      color: rgba(255,255,255,.9);
    }

    /* Reduce motion for accessibility */
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>

<body class="layout-fixed">

  <div class="container-xxl py-4 py-sm-5">
    <div class="row justify-content-center align-items-center g-4">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card erp-card glass">
          <div class="card-header erp-card-header py-4 text-center">
            <div class="d-flex align-items-center justify-content-center gap-3">
              <div class="erp-brand-mark">
                <i class="fa-solid fa-bread-slice" style="color: #fff; font-size: 1.6rem;"></i>
              </div>
              <div class="text-start">
                <div class="fw-bold fs-4" style="line-height:1.2;">Baryal Biscuit Factory ERP</div>
                <div class="subline small mt-1">Manufacturing • Procurement • Production • Finance</div>
              </div>
            </div>
          </div>

          <div class="card-body p-4 p-sm-5">
            <div class="text-center mb-4">
              <div class="fw-semibold fs-5">Sign in</div>
              <div class="text-muted small">Use your work credentials to continue.</div>
            </div>

            <div id="alertBox" class="alert d-none" role="alert"></div>

            <form id="loginForm" class="needs-validation" novalidate autocomplete="on">
              <div class="form-floating mb-3">
                <input
                  type="text"
                  class="form-control"
                  id="username"
                  name="username"
                  placeholder="Username"
                  required
                  autocomplete="username"
                />
                <label for="username"><i class="fa-solid fa-user me-2"></i>Username</label>
                <div class="invalid-feedback">Please enter your username.</div>
              </div>

              <div class="form-floating mb-3">
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  placeholder="Password"
                  required
                  autocomplete="current-password"
                />
                <label for="password"><i class="fa-solid fa-lock me-2"></i>Password</label>
                <div class="invalid-feedback">Please enter your password.</div>
              </div>

              <div class="row align-items-center mb-2">
                <div class="col-7">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="1" id="remember" />
                    <label class="form-check-label" for="remember">Remember me</label>
                  </div>
                </div>
                <div class="col-5 text-end">
                  <a href="#" id="forgotPassword" class="small text-decoration-none" style="color: var(--erp-primary);">Forgot password?</a>
                </div>
              </div>

              <button id="btnSignIn" class="btn btn-erp w-100 py-2" type="submit">
                <span class="d-inline-flex align-items-center justify-content-center">
                  <i class="fa-solid fa-right-to-bracket me-2"></i>
                  <span>Sign in</span>
                </span>
              </button>

              <div class="text-center mt-3 small text-muted">
                <span class="me-2">Demo mode</span>
                <button
                  type="button"
                  id="enterDemo"
                  class="btn btn-link p-0 text-decoration-none"
                  style="color: var(--erp-primary);"
                >
                  Enter dashboard
                </button>
              </div>

              <div class="text-center mt-4 small" style="color: var(--erp-muted);">
                © <span id="year"></span> Baryal Biscuit Factory ERP • Version 1.0
              </div>
            </form>
          </div>
        </div>

        <div class="text-center mt-3 small text-muted">
          <i class="fa-solid fa-shield-halved me-2" style="color: var(--erp-primary);"></i>
          Secure sign-in UI (connect to backend later).
        </div>
      </div>
    </div>
  </div>

  <!-- AdminLTE JS (depends on Bootstrap) -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars/js/OverlayScrollbars.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/js/adminlte.min.js"></script>

  <script>
    (function () {
      const yearEl = document.getElementById('year');
      if (yearEl) yearEl.textContent = new Date().getFullYear();

      const form = document.getElementById('loginForm');
      const alertBox = document.getElementById('alertBox');
      const btn = document.getElementById('btnSignIn');
      const enterDemo = document.getElementById('enterDemo');
      const forgotPassword = document.getElementById('forgotPassword');

      function showAlert(type, message) {
        if (!alertBox) return;
        alertBox.className = 'alert';
        alertBox.classList.remove('d-none');
        alertBox.classList.add(type === 'success' ? 'alert-success' : (type === 'warning' ? 'alert-warning' : 'alert-danger'));
        alertBox.textContent = message;
      }

      function setLoading(isLoading) {
        if (!btn) return;
        btn.disabled = isLoading;
        btn.style.opacity = isLoading ? '0.9' : '1';
        btn.innerHTML = isLoading
          ? '<span class="d-inline-flex align-items-center justify-content-center"><span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Signing in...</span>'
          : '<span class="d-inline-flex align-items-center justify-content-center"><i class="fa-solid fa-right-to-bracket me-2"></i><span>Sign in</span></span>';
      }

      // Basic client-side validation and placeholders for backend integration.
      form?.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Native validation
        if (!form.checkValidity()) {
          e.stopPropagation();
          form.classList.add('was-validated');
          showAlert('danger', 'Please fix the highlighted fields and try again.');
          return;
        }

        const username = document.getElementById('username')?.value?.trim();
        const password = document.getElementById('password')?.value;
        const remember = document.getElementById('remember')?.checked ? '1' : '0';

        // SECURITY NOTE: This UI does NOT authenticate by itself.
        // Replace the endpoint below with your backend route.
        const payload = { username, password, remember };

        try {
          setLoading(true);
          showAlert('warning', 'Connecting to authentication service...');

          // Placeholder fetch. Change /api/auth/login to your real endpoint.
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            const msg = await res.text().catch(() => 'Authentication failed.');
            throw new Error(msg || 'Authentication failed.');
          }

          // Expecting JSON: { redirectUrl: "/dashboard" } or similar.
          let data = {};
          try { data = await res.json(); } catch (_) {}

          showAlert('success', 'Login successful. Redirecting...');
          const redirectUrl = data.redirectUrl || '/dashboard.html';
          setTimeout(() => { window.location.href = redirectUrl; }, 650);
        } catch (err) {
          showAlert('danger', (err && err.message) ? err.message : 'Login failed. Please check your credentials.');
        } finally {
          setLoading(false);
        }
      });

      // Demo mode stub: does not bypass security on its own.
      // Later, implement demo token/session handling.
      enterDemo?.addEventListener('click', () => {
        showAlert('warning', 'Demo mode is not connected to backend yet.');
        // Placeholder redirect. Keep it safe until backend exists.
        setTimeout(() => {
          // If you later create a real dashboard route, update this.
          // window.location.href = '/dashboard.html';
        }, 500);
      });

      forgotPassword?.addEventListener('click', (e) => {
        e.preventDefault();
        showAlert('warning', 'Forgot password is not configured yet. Connect it to backend later.');
      });

      // Bootstrap/AdminLTE init (if needed)
      // OverlayScrollbars optional; AdminLTE will handle layouts automatically.
    })();
  </script>
</body>
</html>
